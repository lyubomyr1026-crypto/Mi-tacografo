name: Build APK
on:
  workflow_dispatch: {}
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Stable signing key
        run: mkdir -p ~/.android && cp debug.keystore ~/.android/debug.keystore
      - name: Layout (працює і з плоскою структурою)
        run: |
          mkdir -p www assets
          [ -f www/index.html ] || cp index.html www/index.html
          [ -f assets/icon.png ] || cp icon.png assets/icon.png
      - run: npm install
      - run: npx cap add android
      - name: Icon
        run: |
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          for d in android/app/src/main/res/mipmap-*; do
            cp assets/icon.png "$d/ic_launcher.png"
            cp assets/icon.png "$d/ic_launcher_round.png"
            cp assets/icon.png "$d/ic_launcher_foreground.png"
          done
      - name: Plugin "Зберегти як" (системне вікно вибору місця)
        run: |
          D=android/app/src/main/java/com/mitacografo/app
          cat > $D/SaveFilePlugin.java <<'EOF'
          package com.mitacografo.app;
          import android.app.Activity;
          import android.content.Intent;
          import android.net.Uri;
          import androidx.activity.result.ActivityResult;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.ActivityCallback;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import java.io.OutputStream;
          @CapacitorPlugin(name = "SaveFile")
          public class SaveFilePlugin extends Plugin {
            private Intent createIntent(PluginCall call, boolean persist) {
              Intent i = new Intent(Intent.ACTION_CREATE_DOCUMENT);
              i.addCategory(Intent.CATEGORY_OPENABLE);
              i.setType("application/json");
              i.putExtra(Intent.EXTRA_TITLE, call.getString("filename", "mi-tacografo.json"));
              if (persist) i.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION | Intent.FLAG_GRANT_WRITE_URI_PERMISSION | Intent.FLAG_GRANT_PERSISTABLE_URI_PERMISSION);
              return i;
            }
            @PluginMethod
            public void save(PluginCall call) {
              startActivityForResult(call, createIntent(call, false), "saveResult");
            }
            @PluginMethod
            public void pick(PluginCall call) {
              startActivityForResult(call, createIntent(call, true), "pickResult");
            }
            @PluginMethod
            public void write(PluginCall call) {
              try (OutputStream os = getContext().getContentResolver().openOutputStream(Uri.parse(call.getString("uri", "")), "wt")) {
                os.write(call.getString("data", "").getBytes("UTF-8"));
                call.resolve();
              } catch (Exception e) { call.reject(String.valueOf(e.getMessage())); }
            }
            @ActivityCallback
            private void saveResult(PluginCall call, ActivityResult result) {
              if (call == null) return;
              if (result.getResultCode() != Activity.RESULT_OK || result.getData() == null) { call.reject("cancelled"); return; }
              Uri uri = result.getData().getData();
              try (OutputStream os = getContext().getContentResolver().openOutputStream(uri, "wt")) {
                os.write(call.getString("data", "").getBytes("UTF-8"));
                call.resolve();
              } catch (Exception e) { call.reject(String.valueOf(e.getMessage())); }
            }
            @ActivityCallback
            private void pickResult(PluginCall call, ActivityResult result) {
              if (call == null) return;
              if (result.getResultCode() != Activity.RESULT_OK || result.getData() == null) { call.reject("cancelled"); return; }
              Uri uri = result.getData().getData();
              try {
                getContext().getContentResolver().takePersistableUriPermission(uri, Intent.FLAG_GRANT_READ_URI_PERMISSION | Intent.FLAG_GRANT_WRITE_URI_PERMISSION);
              } catch (Exception e) { }
              JSObject o = new JSObject();
              o.put("uri", uri.toString());
              call.resolve(o);
            }
          }
          EOF
          cat > $D/MainActivity.java <<'EOF'
          package com.mitacografo.app;
          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;
          public class MainActivity extends BridgeActivity {
            @Override
            public void onCreate(Bundle savedInstanceState) {
              registerPlugin(SaveFilePlugin.class);
              super.onCreate(savedInstanceState);
            }
          }
          EOF
      - name: Будильник (дозволи і звук)
        run: |
          mkdir -p android/app/src/main/res/raw
          python3 - <<'PY'
          import wave, struct, math
          r = 22050
          fr = []
          for rep in range(8):
              for f, d in ((880, 0.18), (0, 0.07), (880, 0.18), (0, 0.07), (1100, 0.18), (0, 0.32)):
                  for i in range(int(r * d)):
                      fr.append(int(20000 * math.sin(2 * math.pi * f * i / r)) if f else 0)
          w = wave.open('android/app/src/main/res/raw/alarm.wav', 'wb')
          w.setnchannels(1); w.setsampwidth(2); w.setframerate(r)
          w.writeframes(b''.join(struct.pack('<h', x) for x in fr)); w.close()
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p, encoding='utf8').read()
          perm = ('<uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n'
                  '    <uses-permission android:name="android.permission.USE_EXACT_ALARM"/>\n'
                  '    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" android:maxSdkVersion="32"/>\n'
                  '    <uses-permission android:name="android.permission.VIBRATE"/>\n    ')
          assert '<application' in s
          s = s.replace('<application', perm + '<application', 1)
          open(p, 'w', encoding='utf8').write(s)
          PY
      - name: Номер версії (щоб APK оновлювався поверх старого)
        run: |
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"0.4.${{ github.run_number }}\"/" android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle
      - run: npx cap sync android
      - name: Build
        working-directory: android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: mi-tacografo-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
