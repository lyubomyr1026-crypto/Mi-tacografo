name: Build APK
on:
  workflow_dispatch: {}
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Stable signing key
        run: mkdir -p ~/.android && cp debug.keystore ~/.android/debug.keystore
      - run: npm install
      - run: npx cap add android
      - name: Icon
        run: |
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          for d in android/app/src/main/res/mipmap-*; do
            cp assets/icon.png "$d/ic_launcher.png"
            cp assets/icon.png "$d/ic_launcher_round.png"
            cp assets/icon.png "$d/ic_launcher_foreground.png"
          done
      - run: npx cap sync android
      - name: Build
        working-directory: android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: mi-tacografo-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
