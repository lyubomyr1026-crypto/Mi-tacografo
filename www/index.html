<head>

<title>Mi Tacógrafo 0.4</title>
<style>
:root{--bg:#f3f1ec;--card:#fff;--ink:#1b1f26;--mut:#5d6573;--line:#d9d5cb;--acc:#b97a00;--accbg:#ffe6a8;--ok:#1d7a46;--bad:#b3261e;--warn:#9a5b00;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161c;--card:#1b212a;--ink:#f1efe8;--mut:#a3abb8;--line:#2d3542;--acc:#f2b632;--accbg:#3a2f12;--ok:#5ed08f;--bad:#ff8a80;--warn:#ffcc66}}
:root[data-theme="dark"]{--bg:#12161c;--card:#1b212a;--ink:#f1efe8;--mut:#a3abb8;--line:#2d3542;--acc:#f2b632;--accbg:#3a2f12;--ok:#5ed08f;--bad:#ff8a80;--warn:#ffcc66}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:transparent;color:var(--ink);font:17px/1.4 "Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;max-width:640px;margin:0 auto;padding-bottom:84px}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 16px 6px}
h1{font-size:22px;margin:0;font-weight:700;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.35)}
h2{font-size:18px;margin:18px 0 8px}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:linear-gradient(to bottom,#0057B7 10%,#FFD500 90%)}
body::after{content:"";position:fixed;inset:0;z-index:-1;background:linear-gradient(to bottom,#AA151B 0%,#AA151B 12%,#F1BF00 38%,#F1BF00 62%,#AA151B 88%,#AA151B 100%);opacity:0;transition:opacity .9s ease}
:root[data-lang="es"] body::after{opacity:1}
main>h2{background:var(--card);display:inline-block;padding:4px 12px;border-radius:10px}
main>.mut{background:var(--card);padding:8px 12px;border-radius:10px}
.v{color:rgba(255,255,255,.88);font-size:14px;margin-left:6px;font-weight:400}
main{padding:0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin:10px 0}
.big{font-size:34px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.mut{color:var(--mut);font-size:14px}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1 1 120px}
label{display:block;font-size:14px;color:var(--mut);margin:8px 0 3px}
input,select{width:100%;min-height:48px;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
button{min-height:52px;font:inherit;font-weight:600;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;cursor:pointer}
button.p{background:var(--acc);color:#1b1500;border-color:var(--acc)}
button.d{color:var(--bad)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
button.full{width:100%;margin-top:12px}
.bar{height:10px;border-radius:5px;background:var(--line);overflow:hidden;margin:8px 0 4px}
.bar i{display:block;height:100%;background:var(--ok)}
.bar i.w{background:var(--warn)}.bar i.b{background:var(--bad)}
.nv{color:var(--warn);font-weight:600}
.ban{border-radius:10px;padding:12px;margin:10px 0;font-weight:600;background:var(--accbg);color:var(--warn)}
.ban.b{color:var(--bad)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);max-width:640px;margin:0 auto}
nav button{flex:1;border:0;border-radius:0;background:none;min-height:60px;font-size:14px;color:var(--mut)}
nav button.on{color:var(--acc);box-shadow:inset 0 3px 0 var(--acc)}
.item{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-top:1px solid var(--line);cursor:pointer}
.item:first-child{border-top:0}
dialog{width:min(600px,94vw);border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);padding:14px}
dialog::backdrop{background:rgba(0,0,0,.5)}
.tag{font-size:13px;color:var(--ok);font-weight:600}
#sh{width:100%;max-width:640px;margin:auto auto 0;border-radius:16px 16px 0 0;max-height:78vh;overflow:auto;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px))}
#al{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;padding:0 14px}
.opt{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 4px;border-top:1px solid var(--line);cursor:pointer;font-size:17px}
button{transition:transform .3s ease,filter .3s ease}
button:active{transform:scale(.9);filter:brightness(.85)}
@keyframes up{from{opacity:0;transform:translateY(55px) scale(.95)}to{opacity:1;transform:none}}
@keyframes grow{from{width:0}}
@keyframes pop{0%{transform:scale(.7);opacity:0}55%{transform:scale(1.08);opacity:1}100%{transform:none}}
@keyframes sheet{from{transform:translateY(180px);opacity:0}to{transform:none;opacity:1}}
main.in>*{animation:up 1.6s cubic-bezier(.33,1,.68,1) both}
main.in>*:nth-child(2){animation-delay:.15s}
main.in>*:nth-child(3){animation-delay:.3s}
main.in>*:nth-child(4){animation-delay:.45s}
main.in>*:nth-child(5){animation-delay:.6s}
main.in>*:nth-child(n+6){animation-delay:.75s}
main.in .bar i{animation:grow 2.6s cubic-bezier(.33,1,.68,1) .4s both}
.ban.new{animation:pop 1.7s cubic-bezier(.33,1,.68,1)}
#sh[open]{animation:sheet 1s cubic-bezier(.33,1,.68,1)}
@keyframes slR{from{opacity:0;transform:translateX(70px)}to{opacity:1;transform:none}}
@keyframes slL{from{opacity:0;transform:translateX(-70px)}to{opacity:1;transform:none}}
main.sr>*{animation:slR .8s cubic-bezier(.33,1,.68,1) both}
main.sl>*{animation:slL .8s cubic-bezier(.33,1,.68,1) both}
main.sr .bar i,main.sl .bar i{animation:grow 1.6s cubic-bezier(.33,1,.68,1) .2s both}
html{overflow-x:hidden}
.drum{position:relative;display:flex;justify-content:center;align-items:center;gap:8px;margin:12px 0;height:168px}
.drum .band{position:absolute;left:12%;right:12%;top:56px;height:56px;border-radius:12px;background:var(--accbg);z-index:0}
.wh{position:relative;z-index:1;height:168px;width:110px;overflow-y:auto;scroll-snap-type:y mandatory;padding:56px 0;scrollbar-width:none;touch-action:pan-y;-webkit-mask-image:linear-gradient(transparent,#000 30%,#000 70%,transparent);mask-image:linear-gradient(transparent,#000 30%,#000 70%,transparent)}
.wh::-webkit-scrollbar{display:none}
.wh div{height:56px;line-height:56px;text-align:center;font-size:30px;font-weight:600;scroll-snap-align:center;font-variant-numeric:tabular-nums}
.drum .colon{position:relative;z-index:1;font-size:32px;font-weight:700}
button[id$="-b"]{background:var(--bg);border-color:var(--line);font-weight:400}
.wk{margin:16px 0 4px;padding:6px 10px;border-radius:8px;background:var(--accbg);font-weight:700;color:var(--ink)}
.card>.wk:first-child{margin-top:0}
.mut.okc,.okc{color:var(--ok);font-weight:700}
.mut.wnc,.wnc{color:#b8860b;font-weight:700}
.mut.badc,.badc{color:var(--bad);font-weight:700}
nav button{padding:0 2px;font-size:13px}
/* b31 skin */
:root,:root:not([data-theme="light"]),:root[data-theme="dark"]{--bg:#0e1c36;--card:#172a4b;--ink:#f2f5f9;--mut:#a9b8d0;--line:#2d4570;--acc:#4d8dff;--accbg:#1f3a68;--ok:#34d27b;--bad:#ff6b63;--warn:#ffc247}
h1{font-size:23px}
header{padding-top:18px}
.card{border-radius:20px;padding:16px;background:linear-gradient(160deg,#1e3560,#142647);border-color:#305083}
.big{font-size:32px}
.hero{background:linear-gradient(160deg,#2e4268,#1d2f52)}
.hero.on{background:linear-gradient(135deg,#1fb859,#0d6b33);border-color:#3be083;box-shadow:0 6px 22px rgba(31,184,89,.28)}
.hero .mut{color:rgba(255,255,255,.88);font-size:16px;font-weight:600}
.hero .big{font-size:54px;color:#fff;letter-spacing:1px}
.mt-h{display:flex;justify-content:space-between;align-items:center;gap:10px}
.lf{background:#0f3d27;border:1px solid #1f7a4b;border-radius:14px;padding:6px 12px;text-align:center;color:var(--ok);line-height:1.15}
.lf span{display:block;font-size:13px}.lf b{font-size:22px;font-variant-numeric:tabular-nums}
.lf.w{background:#3d3010;border-color:#8a6a1a;color:var(--warn)}.lf.b{background:#451a18;border-color:#9a3a33;color:var(--bad)}
.bar{height:12px;border-radius:6px;background:#2c4472}
.bar i{background:linear-gradient(to right,#22c55e,#4ade80);border-radius:6px}
.bar i.w{background:linear-gradient(to right,#e0a020,#ffc247)}.bar i.b{background:linear-gradient(to right,#e0453d,#ff7a72)}
button{border-radius:14px}
button.p{background:linear-gradient(#27c862,#15803d);color:#fff;border-color:#34d27b;font-size:20px;min-height:58px;box-shadow:0 4px 14px rgba(34,197,94,.25)}
button.p.red{background:linear-gradient(#f2453d,#b3261e);border-color:#ff6b63;box-shadow:0 4px 14px rgba(242,69,61,.25)}
nav{background:#122447;border-top:1px solid #2d4570}
nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px}
nav .ic{font-size:21px;filter:grayscale(1) brightness(1.3);line-height:1}
nav button.on{color:var(--acc);box-shadow:none}nav button.on .ic{filter:none}
.drum .band{background:#24427a}
.card.mt{border-left:5px solid var(--mc,#34d27b)}
.card.m9{--mc:#34d27b}.card.m56{--mc:#22d3ee}.card.m90{--mc:#6366f1}
.card.m56 .bar i:not(.w):not(.b){background:linear-gradient(to right,#06b6d4,#67e8f9)}
.card.m90 .bar i:not(.w):not(.b){background:linear-gradient(to right,#4f46e5,#818cf8)}
.card.m56 .lf:not(.w):not(.b){background:#0c3a44;border-color:#1b8aa0;color:#67e8f9}
.card.m90 .lf:not(.w):not(.b){background:#1e1f4d;border-color:#4f52b8;color:#a5b4fc}

.card.ex{border-left:5px solid #c084fc}.card.ex .big{color:#d8b4fe}
.wk{background:#1f3a68;border-left:4px solid #3b82f6;color:var(--ink)}

function exp(){

  if(window.Capacitor&&Capacitor.isNativePlatform&&Capacitor.isNativePlatform()){const C=window.Capacitor;C.registerPlugin('Filesystem').writeFile({path:nm,data:JSON.stringify(S,null,1),directory:'CACHE',encoding:'utf8'}).then(r=>C.registerPlugin('Share').share({title:nm,url:r.uri})).catch(e=>alert(String(e)));return}
  const data=JSON.stringify(S,null,1);
  if(!(window.claude&&claude.use)){expAlt(data,nm);return}

   return d.save({filename:nm,data}).catch(e=>{if(e&&e.code==='declined')return;expAlt(data,nm)})}).catch(()=>expAlt(data,nm))}
function expAlt(data,nm){try{const f=new File([data],nm,{type:'application/json'});if(navigator.canShare&&navigator.canShare({files:[f]})){navigator.share({files:[f],title:nm}).catch(()=>{});return}}catch(e){}

  alert(S.lang==='es'?'Se ha intentado guardar '+nm+' en Descargas. Si no aparece, usa el botón de copiar texto.':'Спробував зберегти '+nm+' у Завантаження. Якщо файлу там немає, скористайся кнопкою копіювання тексту.')}
 catch(e){alert(S.lang==='es'?'No se pudo guardar el archivo. Usa el botón de copiar texto.':'Не вдалося зберегти файл. Скористайся кнопкою копіювання тексту.')}}
function imp(inp){
  const f=inp.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const o=JSON.parse(r.result);if(!o||!Array.isArray(o.shifts))throw 0;
    if(!confirm(t('impq')))return;
    try{localStorage.setItem(KEY+'.backup',JSON.stringify(S))}catch(e){}
    S=norm(o);S.lang=S.lang||'uk';save();render()}catch(e){alert(t('impe'))}};
  r.readAsText(f);inp.value=''}

const bkT=(a,b)=>S.lang==='es'?b:a;
let bk={db:null,uid:'',t:null,busy:false,last:'',err:'',warn:false};
const bkP=()=>'data/users/'+bk.uid;
async function bkInit(){try{if(!(window.claude&&claude.use))return;const u=await claude.use('user'),id=u&&await u.id(),d=await claude.use('db');if(d&&id){bk.db=d;bk.uid=id;bkInfo();bkSoon()}}catch(e){}}
function bkSoon(){if(!bk.db)return;clearTimeout(bk.t);bk.t=setTimeout(bkRun,4000)}
function bkText(){if(!bk.db)return '';if(bk.err)return '⚠ '+bk.err;if(bk.warn)return '⚠ '+bkT('Локальних записів значно менше, ніж у копії на сервері. Автокопію призупинено: відновіть копію.','Hay muchos menos registros locales que en la copia del servidor. Copia automática en pausa: restaura la copia.');return '☁ '+(bk.last?bkT('Остання автокопія: ','Última copia automática: ')+fdt(bk.last):bkT('Автокопія на сервер увімкнена','Copia automática en el servidor activada'))}
function bkInfo(){const e=$('#bk-s');if(e)e.textContent=bkText()}
async function bkIdx(){const g=await bk.db.doc(bkP()+'/idx').get();return g.exists&&Array.isArray(g.data().list)?g.data().list:[]}
async function bkRun(){if(!bk.db||bk.busy)return;if(!S.shifts||!S.shifts.length)return;bk.busy=true;
 try{const idx=await bkIdx(),mx=idx.reduce((m,x)=>Math.max(m,x.n||0),0);
  if(mx>=10&&S.shifts.length<mx*0.5){bk.warn=true;bkInfo();bk.busy=false;return}
  bk.warn=false;bk.err='';
  const json=JSON.stringify(S),day=nowS().slice(0,10),CH=80000,parts=Math.ceil(json.length/CH);
  for(let i=0;i<parts;i++)await bk.db.doc(bkP()+'/c-'+day+'-'+i).set({s:json.slice(i*CH,(i+1)*CH)});
  const old=idx.find(x=>x.d===day);
  if(old)for(let i=parts;i<old.p;i++)await bk.db.doc(bkP()+'/c-'+day+'-'+i).delete().catch(()=>{});
  const e={d:day,p:parts,n:S.shifts.length,ts:nowS()},L=idx.filter(x=>x.d!==day);L.push(e);L.sort((a,b)=>a.d<b.d?1:-1);
  const drop=L.splice(14);await bk.db.doc(bkP()+'/idx').set({list:L});
  for(const x of drop)for(let i=0;i<x.p;i++)await bk.db.doc(bkP()+'/c-'+x.d+'-'+i).delete().catch(()=>{});
  bk.last=e.ts;bkInfo()}
 catch(e){bk.err=String(e&&e.message||e);bkInfo()}
 bk.busy=false}
function bkMsg(m){const dg=$('#dg');dg.innerHTML=`<div>${m}</div><div class="row" style="margin-top:12px"><button onclick="$('#dg').close()">${t('cancel')}</button></div>`;if(!dg.open)dg.showModal()}
async function bkOpen(){if(!bk.db){bkMsg(bkT('Копія на сервері доступна лише у сторінці Claude з входом в акаунт.','La copia del servidor solo está disponible en la página de Claude con la sesión iniciada.'));return}
 try{const L=await bkIdx(),dg=$('#dg');
  dg.innerHTML=`<h2 style="margin-top:0">☁ ${bkT('Копії на сервері','Copias del servidor')}</h2>`+(L.length?L.map(x=>`<button class="full" style="margin-bottom:8px" onclick="bkRestore('${x.d}',${x.p})">${x.d} · ${x.n} ${bkT('змін','jornadas')}</button>`).join(''):`<div class="mut">${bkT('Копій ще немає.','Aún no hay copias.')}</div>`)+`<div class="row" style="margin-top:12px"><button onclick="$('#dg').close()">${t('cancel')}</button></div>`;dg.showModal()}
 catch(e){bkMsg(esc(String(e&&e.message||e)))}}
async function bkRestore(d,p){const dg=$('#dg');dg.innerHTML=`<div class="mut">${bkT('Завантажую…','Cargando…')}</div>`;
 try{let s='';for(let i=0;i<p;i++){const g=await bk.db.doc(bkP()+'/c-'+d+'-'+i).get();if(!g.exists)throw new Error('part '+i);s+=g.data().s}
  const o=JSON.parse(s);if(!o||!Array.isArray(o.shifts))throw new Error('format');bk.pend=o;
  dg.innerHTML=`<h2 style="margin-top:0">☁ ${d}</h2><div>${bkT('Замінити поточні дані копією від ','¿Reemplazar los datos actuales con la copia del ')}${d} (${o.shifts.length} ${bkT('змін','jornadas')})?</div><div class="row" style="margin-top:12px"><button class="p" onclick="bkApply()">${bkT('Відновити','Restaurar')}</button><button onclick="$('#dg').close()">${t('cancel')}</button></div>`}
 catch(e){bkMsg(bkT('Не вдалося відновити копію.','No se pudo restaurar la copia.')+' '+esc(String(e&&e.message||'')))}}
function bkApply(){const o=bk.pend;if(!o)return;try{localStorage.setItem(KEY+'.backup',JSON.stringify(S))}catch(e){}bk.warn=false;bk.pend=null;S=norm(o);save();$('#dg').close();render()}
load();initLists();render();pulse();setInterval(alerts,10000);bkInit();
</script>
